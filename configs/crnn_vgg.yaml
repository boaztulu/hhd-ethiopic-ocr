# CRNN with a VGG encoder (Shi et al. 2016): 48x368 stretch input, light augmentation.
model:
  name: crnn
  kwargs:
    backbone: vgglike
    lstm_hidden: 256
    lstm_layers: 2
    dropout: 0.1

image:
  height: 48
  width: 368
  preserve_aspect: false  # 48x368 stretch: the published input size, not its letterbox resize

augment:
  level: light

max_text_len: 80

train:
  epochs: 80
  batch_size: 96
  num_workers: 4
  lr: 1.0e-3
  weight_decay: 0.0
  warmup_steps: 500
  grad_accum: 1

eval:
  batch_size: 192

val_seed: 0

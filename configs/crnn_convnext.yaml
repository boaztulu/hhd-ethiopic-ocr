# CRNN with ConvNeXt-Tiny backbone, CTC head. Real-data fine-tuning config.
model:
  name: crnn
  kwargs:
    backbone: convnext
    lstm_hidden: 256
    lstm_layers: 2
    dropout: 0.1
    pretrained: true

image:
  height: 48
  width: 512
  preserve_aspect: true

augment:
  level: medium

max_text_len: 80

train:
  epochs: 80
  batch_size: 64
  num_workers: 4
  lr: 3.0e-4
  weight_decay: 0.01
  warmup_steps: 800
  grad_accum: 1

eval:
  batch_size: 128

val_seed: 0
